# Build and validate only (spec section 10). This workflow never commits,
# pushes, deploys or changes settings, and uses no secrets. Deployment stays
# with GitHub's built-in Pages workflow. tests/unit/test_workflow_boundaries.py
# fails if any of these boundaries is loosened.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # some tests read the baseline commit de019d2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install pinned packages
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -m "not browser" tests

  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # V11 reads the page each lock was bootstrapped from
      - name: Checkout the pinned Book 3 preservation source (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: manassa-study/Tafseer
          ref: fbbbae5b51e526d6f5e27e3f6dac7d8fdf22f6b2
          path: .baseline/tafseer
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install pinned build packages
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Verify pinned Book 4 baseline preservation
        run: python tools/check_book4_baseline.py
      - name: Every committed page equals a fresh build, all validators pass (V1-V11, V13)
        # The one-time --baseline-data identity gate applied to the Book 3 pilot only.
        run: python tools/build.py check --all

  id-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install pinned build packages
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Each lock only grows, against the previous main (section 6)
        env:
          BASE: ${{ github.event_name == 'push' && 'HEAD^1' || 'origin/main' }}
        run: |
          for f in books/*/book.json; do
            python tools/build.py ids invariants "$(basename "$(dirname "$f")")" --base "$BASE"
          done

  reports:
    # Material for reviewers. Never fails the pull request (spec section 10).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install pinned build packages
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Diff and content-change reports against the committed pages
        run: |
          python tools/build.py diff --all --out reports/build-diff --against origin/main || true
          {
            echo "## Build reports"
            for f in reports/build-diff/*.md; do echo; echo "### $(basename "$f")"; head -c 60000 "$f"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-reports
          path: reports/build-diff/
          retention-days: 30

  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install pinned build packages
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Two clean builds give identical manifests and bytes (V10)
        run: python tools/check_reproducible.py

  browser:
    # Blocking from the pilot migration (Phase 2, spec section 9); it was advisory in Phase 1.
    # No secrets; every request outside 127.0.0.1 is blocked, so Supabase is never reached.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install pinned packages
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest -q -p no:cacheprovider -m browser tests
